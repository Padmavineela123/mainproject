services:
  - type: web
    name: ai-interview-prep-server
    runtime: node
    plan: free
    rootDir: minor/server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@aiinterviewprep.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
